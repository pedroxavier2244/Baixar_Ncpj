worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Rate limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ── Upstream da API CNPJ ─────────────────────────────────────────────────
    upstream api {
        server cnpj_api:8000;
        keepalive 32;
    }

    # ── API CNPJ ─────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        location = /health {
            proxy_pass http://api;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
        }

        location / {
            limit_req zone=api burst=1000 nodelay;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "X-API-Key, Content-Type, Accept" always;

            proxy_pass http://api;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            add_header X-XSS-Protection "1; mode=block";
        }
    }

    # ── Radar ────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name radar.mbfinance.com.br;

        location / {
            proxy_pass http://172.17.0.1:6767;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }
    }

    # ── organograma: porta 80 so redireciona ─────────────────────────────────
    # Quem serve o organograma e o nginx do HOST, em :443. A porta 80 deste host
    # pertence a este container, e sem um bloco nomeado o nome caia no
    # `server_name _` acima e recebia o 404 da API CNPJ.
    #
    # Nao interfere na renovacao do certificado: ela e `--standalone` com
    # `pre_hook = docker stop cnpj_nginx`, entao este bloco nao esta no ar na
    # hora do desafio ACME.
    server {
        listen 80;
        server_name organograma.mbfinance.com.br;
        return 301 https://$host$request_uri;
    }
}
